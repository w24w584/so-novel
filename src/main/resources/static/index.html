<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- 移动端视口设置 -->
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
  <!-- 安卓/Chrome Web App 全屏显示 -->
  <meta content="yes" name="mobile-web-app-capable">
  <!-- iOS Safari 全屏显示 (保留兼容) -->
  <meta content="yes" name="apple-mobile-web-app-capable">
  <!-- 禁止 iOS 自动识别电话号码 -->
  <meta content="telephone=no" name="format-detection">
  <title>SoNovel WebUI</title>
  <link href="favicon.ico" rel="icon">
  <script src="js/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#5d5d81', 'primary-hover': '#7b7b9d' },
          fontFamily: {
            sans: ['Roboto', 'Helvetica Neue', 'Helvetica', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Arial', 'sans-serif'],
            serif: ['Noto Serif SC', 'PingFang SC', 'Heiti SC', 'Microsoft YaHei', 'Times New Roman', 'serif']
          }
        }
      }
    }
  </script>
  <script defer src="js/alpine.min.js"></script>
  <style>
    [x-cloak] {
      display: none !important
    }

    html {
      scrollbar-gutter: stable;
      overflow-y: scroll
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans leading-relaxed min-h-screen overflow-x-hidden"
      x-data="App()">

<div class="max-w-5xl mx-auto px-4 py-4 sm:px-6 sm:py-6 flex flex-col min-h-screen" x-cloak>
  <header class="relative flex flex-col items-center mb-6 sm:mb-8 pt-2 pb-1">
    <!-- LOGO -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <h1 class="m-0 flex items-baseline gap-1.5 sm:gap-2">
        <span class="text-2xl sm:text-4xl font-light text-gray-700 tracking-wide">SO</span>
        <span class="text-2xl sm:text-4xl font-light text-gray-700 tracking-wide">NOVEL</span>
      </h1>
    </div>
    <div class="mt-3 h-px w-20 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
    <a :href="versionLink"
       class="mt-2.5 inline-flex items-center text-xs sm:text-sm text-green-700 bg-green-50 px-2.5 py-0.5 rounded-full no-underline hover:bg-green-100 transition-colors ring-1 ring-green-200/60"
       target="_blank"
       x-text="'v' + (serverConfig.version || 'ersion')"></a>
    <div class="absolute right-0 top-0 text-[10px] text-gray-300 select-none"
         x-show="serverConfig.buildTime" x-text="'打包 ' + serverConfig.buildTime"
         title="该版本最后打包时间，方便确认当前运行的代码版本"></div>
    <button @click="toggleSettings()"
            class="absolute right-0 top-1/2 -translate-y-1/2 flex items-center gap-2 text-xs text-gray-400 hover:text-primary transition-colors">
      <span>设置</span>
      <span class="relative inline-flex items-center w-9 h-5 rounded-full transition-colors duration-200"
            :class="settingsVisible ? 'bg-primary' : 'bg-gray-300'">
        <span class="inline-block w-3.5 h-3.5 bg-white rounded-full shadow transition-transform duration-200"
              :class="settingsVisible ? 'translate-x-[18px]' : 'translate-x-[3px]'"></span>
      </span>
    </button>
  </header>

  <!-- 设置面板 -->
  <section class="relative mb-6" :class="sectionClass" x-show="settingsVisible" x-transition>
    <h2 class="my-3" :class="h2Class">偏好设置</h2>
    <button @click="showSources = true; fetchSources()"
            class="absolute right-4 sm:right-6 top-4 sm:top-6 text-sm text-gray-400 hover:text-primary px-2 py-1 rounded border border-gray-200 hover:border-primary transition-colors">
      书源列表
    </button>
    <p class="text-sm text-gray-500 mb-4">以下设置仅保存在浏览器本地，不会修改服务器配置。</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-x-8 sm:gap-y-5">
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-sm font-medium text-gray-600">下载格式</label>
        <select @change="handleSettingChange" :class="inputClass" x-model="settings.format">
          <option value="">跟随服务器配置</option>
          <option value="epub">EPUB</option>
          <option value="txt">TXT</option>
          <option value="html">HTML</option>
          <option value="pdf">PDF</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-sm font-medium text-gray-600">书籍内容语言</label>
        <select @change="handleSettingChange" :class="inputClass" x-model="settings.language">
          <option value="">自动</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁体中文(台湾)</option>
          <option value="zh-Hant">繁体中文</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-sm font-medium text-gray-600">每页显示数量</label>
        <input :max="searchLimitMax" :min="10" @change="validateAndSaveSettings('searchLimit')"
               :class="inputClass" placeholder="默认"
               type="number" x-model.number="settings.searchLimit">
      </div>
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-sm font-medium text-gray-600">下载并发限制</label>
        <input :max="concurrencyMax" :min="1" @change="validateAndSaveSettings('concurrency')"
               :class="inputClass" placeholder="默认"
               type="number" x-model.number="settings.concurrency">
      </div>
      <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 pl-3 pr-4 py-2.5 sm:col-span-2">
        <div class="min-w-0">
          <div class="text-sm font-medium text-gray-600">精准搜索</div>
          <div class="text-xs text-gray-400 truncate">开启后仅返回书名或作者包含搜索词的结果</div>
        </div>
        <input class="h-4 w-4 shrink-0 rounded border-gray-300 text-primary focus:ring-primary"
               type="checkbox" :title="settings.precisionSearch ? '已开启精准搜索' : '精准搜索已关闭'"
               x-model="settings.precisionSearch" @change="handleSettingChange">
      </div>
    </div>
    <div class="mt-5 border-t border-gray-100 pt-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-medium text-gray-700">额外书源</h3>
        <div class="flex items-center gap-2">
          <button @click="reloadShareSources()"
                  class="text-xs text-primary hover:text-primary-hover px-2 py-1 border border-primary/30 rounded-lg hover:bg-primary/5 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                  :disabled="shareSourcesLoading"
                  title="当自动读取额外书源失败时，可点击此按钮手动重新读取">
            <span x-show="!shareSourcesLoading">手动读取</span>
            <span x-show="shareSourcesLoading"
                  x-text="'读取中... ' + shareSourcesLoaded + '/' + (shareSourcesTotal || '?')"></span>
          </button>
          <div class="flex items-center gap-2" x-show="shareSources.length > 0">
            <button @click="selectAllShareSources()" class="text-xs text-primary hover:text-primary/80 transition-colors">全选</button>
            <span class="text-gray-300">|</span>
            <button @click="deselectAllShareSources()" class="text-xs text-primary hover:text-primary/80 transition-colors">清空</button>
            <span class="text-gray-300">|</span>
            <button @click="invertShareSources()" class="text-xs text-primary hover:text-primary/80 transition-colors">反选</button>
          </div>
        </div>
      </div>
      <div class="mb-3" x-show="shareSourcesLoading || shareSourcesSummary">
        <div x-show="shareSourcesLoading" class="h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full bg-primary rounded-full transition-all duration-200"
               :style="'width:' + (shareSourcesTotal ? Math.round(shareSourcesLoaded / shareSourcesTotal * 100) : 0) + '%'"></div>
        </div>
        <p class="text-xs text-gray-400 mt-1.5" x-show="shareSourcesSummary" x-text="shareSourcesSummary"></p>
      </div>
      <!-- 来源标签切换 -->
      <div class="mb-3 flex flex-wrap gap-1.5" x-show="shareSources.length > 0">
        <template x-for="g in shareSources" :key="g.file">
          <button @click="switchGroup(g.file)"
                  class="px-3 py-1 rounded-full text-xs transition-colors border"
                  :class="activeGroup === g.file
                    ? 'bg-primary border-primary text-white'
                    : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100 hover:text-gray-700'">
            <span x-text="`${g.file} · ${g.sources.length}`"></span>
          </button>
        </template>
      </div>
      <div class="mb-3" x-show="shareSources.length > 0">
        <input type="text" x-model="shareSourceFilter" @input="resetShareSourceView()"
               :class="inputClass" placeholder="按名称或网址过滤书源">
      </div>
      <template x-for="group in shareSources" :key="group.file">
        <div class="mb-4 last:mb-0 border border-gray-100 rounded-lg p-3" x-show="activeGroup === group.file">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-500" x-text="`${group.file} (${filteredCount(group)})`"></span>
            <div class="flex items-center gap-1 text-xs">
              <button @click="selectGroupShareSources(group)" class="text-gray-400 hover:text-primary transition-colors">全选</button>
              <span class="text-gray-200">/</span>
              <button @click="invertGroupShareSources(group)" class="text-gray-400 hover:text-primary transition-colors">反选</button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1.5">
            <template x-for="s in sourcesFor(group)" :key="s.sourceId">
              <label class="flex items-start gap-2 text-sm"
                     :class="s.disabled ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 cursor-pointer hover:text-gray-800'">
                <input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary mt-0.5 flex-shrink-0"
                       :disabled="s.disabled"
                       type="checkbox" :value="s.sourceId" x-model="settings.shareSourceIds"
                       @change="handleSettingChange">
                <span class="flex flex-col min-w-0">
                  <span class="truncate flex items-center gap-1.5">
                    <span x-text="s.name"></span>
                    <span x-show="s.disabled"
                          class="inline-flex items-center text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-400 border border-gray-200/80 whitespace-nowrap"
                          :title="s.disabledReason || '该额外书源不可用'"
                          x-text="s.disabledReason ? '不可用' : ''"></span>
                  </span>
                  <span class="text-xs truncate"
                        :class="s.disabled ? 'text-gray-300' : 'text-gray-400'"
                        x-show="s.url" x-text="s.url"></span>
                </span>
              </label>
            </template>
          </div>
          <div class="mt-2 text-center" x-show="filteredCount(group) > shareSourceLimit">
            <button @click="loadMoreShareSources()"
                    class="text-xs text-primary hover:text-primary/80 transition-colors"
                    x-text="'显示更多（剩余 ' + (filteredCount(group) - shareSourceLimit) + '）'"></button>
          </div>
        </div>
      </template>
      <div class="py-6 text-center text-sm text-gray-400" x-show="!shareSourcesFetched && !shareSourcesLoading">
        正在加载书源列表...
      </div>
      <div class="py-6 text-center text-sm text-gray-400" x-show="shareSourcesFetched && shareSources.length === 0">
        暂无额外书源，可点击右上角「手动读取」重新读取
      </div>
    </div>
  </section>

  <main class="flex flex-col gap-6 flex-1">
    <!-- 搜索区域 -->
    <section :class="sectionClass" id="downloadContainer">
      <div class="flex items-center justify-between mb-5">
        <h2 class="my-3" :class="h2Class">搜索书籍</h2>
        <button @click="showSearchHistory = !showSearchHistory" :class="iconBtnClass"
                title="历史记录" x-html="iconClock"></button>
      </div>
      <div class="relative mb-5">
        <input :disabled="isSearching"
               @keydown.enter="aggregatedSearch"
               @input.debounce.300ms="fetchSuggestions" @blur="closeSuggestions"
               aria-label="搜索书名或作者"
               autocomplete="off"
               class="w-full pl-4 pr-12 py-3 border border-gray-200 rounded-xl text-base bg-gray-50 focus:outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/10 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed transition-all"
               placeholder="请输入书名或作者，尽量输完整" x-model="searchKeyword">
        <button x-show="!isSearching" @click="aggregatedSearch"
                aria-label="搜索"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-lg text-gray-400 hover:text-primary hover:bg-primary/5 transition-colors"
                x-html="iconSearch"></button>
        <button x-show="isSearching" @click="cancelSearch"
                aria-label="停止搜索" title="停止搜索"
                class="absolute right-2 top-1/2 -translate-y-1/2 inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-red-500 border border-red-200 bg-red-50 hover:bg-red-100 transition-colors">
          <span x-html="iconStop"></span>停止
        </button>
        <div x-show="showSuggestions && suggestions.length > 0"
             class="absolute z-50 left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
          <template x-for="(s, i) in suggestions" :key="i">
            <div @mousedown.prevent="selectSuggestion(i)"
                 class="px-4 py-2 text-sm cursor-pointer text-gray-700 hover:bg-gray-50"
                 x-text="s"></div>
          </template>
        </div>
      </div>

      <!-- 搜索进度条（搜索期间只用这个内联进度，不再弹全屏模态） -->
      <div class="mb-3" x-show="isSearching">
        <div class="flex items-center justify-between text-xs text-gray-600 mb-1.5">
          <span class="inline-flex items-center gap-1.5">
            <span class="h-3 w-3 animate-spin rounded-full border-2 border-gray-300 border-t-primary"></span>
            <span x-text="searchScanTotal > 0 ? '正在聚合搜索' : '正在准备搜索...'"></span>
          </span>
          <span x-text="searchScanTotal > 0
            ? `已扫描 ${searchScanDone}/${searchScanTotal} 个书源 · 命中 ${searchFoundCount} 条`
            : '正在获取书源...'"></span>
        </div>
        <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-200">
          <div class="h-full rounded-full bg-primary transition-all duration-300"
               :style="'width:' + (searchScanTotal > 0 ? Math.max(2, Math.round(searchScanDone / searchScanTotal * 100)) : 2) + '%'"></div>
        </div>
      </div>

      <!-- 搜索结果 桌面端 -->
      <div x-show="bookCache.length > 0" x-transition>
        <div class="hidden md:block overflow-visible rounded-lg border border-gray-200">
          <table class="w-full text-sm">
            <thead class="bg-gray-100 sticky top-0">
            <tr>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">No</th>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">书名</th>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">作者</th>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">最新章节</th>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">最后更新</th>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">源站</th>
              <th class="px-3 py-2 text-left font-semibold text-gray-500">操作</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <template :key="item.url + '-' + index" x-for="(item, index) in paginatedBooks">
              <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-3 py-2" x-text="getGlobalIndex(index)"></td>
                <td class="px-3 py-2 font-medium" x-text="item.bookName"></td>
                <td class="px-3 py-2 text-gray-600 whitespace-nowrap" x-text="item.author"></td>
                <td class="px-3 py-2 text-gray-600" x-text="item.latestChapter || ''"></td>
                <td class="px-3 py-2 text-gray-500 text-xs" x-text="item.lastUpdateTime || ''"></td>
                <td class="px-3 py-2 text-gray-600">
                  <div class="flex items-center gap-1.5">
                    <span class="inline-block h-2 w-2 shrink-0 rounded-full"
                          :style="'background-color: ' + sourceColor(item.sourceGroup, item.sourceName)"></span>
                    <a :href="item.url" target="_blank" class="text-primary hover:underline"
                       x-text="item.sourceName"></a>
                  </div>
                </td>
                <td class="px-3 py-2 overflow-visible whitespace-nowrap">
                  <button @click.stop="toggleDownloadMenu(index, item, $event)"
                          class="p-1.5 border border-gray-200 rounded-md bg-gray-100 text-primary hover:bg-gray-200 transition-colors"
                          title="选择下载格式"
                          x-html="iconDownload"></button>
                </td>
              </tr>
            </template>
            </tbody>
          </table>
        </div>

        <!-- 搜索结果 移动端 -->
        <div class="md:hidden space-y-4">
          <template :key="'m-' + item.url + '-' + index" x-for="(item, index) in paginatedBooks">
            <div class="border border-gray-200 rounded-lg p-3 shadow-sm bg-white">
              <div class="flex justify-between items-start gap-2 py-1.5 border-b border-gray-100">
                <span class="text-sm font-semibold text-gray-500 shrink-0">No</span>
                <span class="text-sm text-right" x-text="getGlobalIndex(index)"></span>
              </div>
              <div class="flex justify-between items-start gap-2 py-1.5 border-b border-gray-100"
                   x-show="item.bookName">
                <span class="text-sm font-semibold text-gray-500 shrink-0">书名</span>
                <span class="text-sm font-medium text-right break-all" x-text="item.bookName"></span>
              </div>
              <div class="flex justify-between items-start gap-2 py-1.5 border-b border-gray-100"
                   x-show="item.author">
                <span class="text-sm font-semibold text-gray-500 shrink-0">作者</span>
                <span class="text-sm text-right" x-text="item.author"></span>
              </div>
              <div class="flex justify-between items-start gap-2 py-1.5 border-b border-gray-100"
                   x-show="item.latestChapter">
                <span class="text-sm font-semibold text-gray-500 shrink-0">最新章节</span>
                <span class="text-sm text-right break-all" x-text="item.latestChapter"></span>
              </div>
              <div class="flex justify-between items-start gap-2 py-1.5 border-b border-gray-100"
                   x-show="item.lastUpdateTime">
                <span class="text-sm font-semibold text-gray-500 shrink-0">最后更新</span>
                <span class="text-sm text-gray-500 text-right" x-text="item.lastUpdateTime"></span>
              </div>
              <div class="flex justify-between items-start gap-2 py-1.5 border-b border-gray-100"
                   x-show="item.sourceName">
                <span class="text-sm font-semibold text-gray-500 shrink-0">前往源站</span>
                <span class="inline-flex items-center gap-1.5 text-right">
                  <span class="inline-block h-2 w-2 shrink-0 rounded-full"
                        :style="'background-color: ' + sourceColor(item.sourceGroup, item.sourceName)"></span>
                  <a :href="item.url" target="_blank"
                     class="text-sm text-right text-primary hover:underline"
                     x-text="item.sourceName"></a>
                </span>
              </div>
              <div class="flex justify-between items-center gap-2 py-2 border-b border-gray-100">
                <span class="text-sm font-semibold text-gray-500 shrink-0">操作</span>
                <button @click.stop="toggleDownloadMenu(index, item, $event)"
                        class="inline-flex items-center justify-center gap-0.5 py-1.5 px-2 border border-gray-200 rounded-md bg-gray-100 text-primary hover:bg-gray-200 transition-colors"
                        title="选择下载格式">
                  <span x-html="iconDownload"></span>
                </button>
              </div>
            </div>
          </template>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-4 pt-4 border-t border-gray-200"
             x-show="totalPages > 1">
          <span class="text-sm text-gray-500"
                x-text="'共 ' + bookCache.length + ' 条，第 ' + currentPage + '/' + totalPages + ' 页'"></span>
          <div class="flex flex-wrap items-center justify-center gap-1">
            <button :disabled="currentPage <= 1" @click="changePage('prev')"
                    class="min-w-8 h-8 px-2 text-sm border border-gray-200 rounded-md hover:border-primary hover:text-primary disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              上一页
            </button>
            <template x-if="paginationInfo.start > 1">
              <button @click="changePage(1)"
                      class="min-w-8 h-8 px-2 text-sm border border-gray-200 rounded-md hover:border-primary hover:text-primary transition-colors">
                1
              </button>
            </template>
            <template x-if="paginationInfo.start > 2">
              <span class="px-1 text-gray-400 text-sm">…</span>
            </template>
            <template :key="p" x-for="p in paginationInfo.pages">
              <button
                :class="p === currentPage ? 'bg-primary border-primary text-white' : 'border-gray-200 hover:border-primary hover:text-primary'"
                @click="changePage(p)"
                class="min-w-8 h-8 px-2 text-sm border rounded-md transition-colors"
                x-text="p"></button>
            </template>
            <template x-if="paginationInfo.end < totalPages - 1">
              <span class="px-1 text-gray-400 text-sm">…</span>
            </template>
            <template x-if="paginationInfo.end < totalPages">
              <button @click="changePage(totalPages)"
                      class="min-w-8 h-8 px-2 text-sm border border-gray-200 rounded-md hover:border-primary hover:text-primary transition-colors"
                      x-text="totalPages"></button>
            </template>
            <button :disabled="currentPage >= totalPages" @click="changePage('next')"
                    class="min-w-8 h-8 px-2 text-sm border border-gray-200 rounded-md hover:border-primary hover:text-primary disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              下一页
            </button>
          </div>
        </div>
      </div>
    </section>

    <section :class="sectionClass">
      <div class="flex items-center justify-between mb-5">
        <h2 class="my-0" :class="h2Class">已下书籍</h2>
        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-400" x-show="localBooksLoading">刷新中...</span>
          <button @click="fetchLocalBooks()" :disabled="localBooksLoading"
                  :class="[iconBtnClass, localBooksLoading ? 'animate-spin' : '']"
                  title="刷新" x-html="iconRefresh"></button>
        </div>
      </div>

      <div class="py-6 text-center text-sm text-gray-400" x-show="localBooksLoading && localBooks.length === 0">

          <template :key="'lm-' + item.name" x-for="item in localBooks">
            <div class="border border-gray-200 rounded-lg p-3 shadow-sm bg-white">

                      x-text="formatDate(item.timestamp)"></span>

              <div class="flex justify-between items-center gap-2 py-2">

                <div class="flex items-center gap-2">

  </main>

  <div class="max-w-lg" :class="cardClass"

            <div class="text-xs text-gray-400 truncate" x-text="s.url"></div>

            <span class="text-xs" x-show="s.delay != null"
                  :class="s.delay < 0 ? 'text-red-500' : 'text-green-500'"
                  x-text="s.delay < 0 ? '超时' : s.delay + ' ms'"></span>

            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium"
                  :class="s.disabled ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-600'"
                  x-text="s.disabled ? '禁用' : '启用'"></span>

<script src="js/api.js"></script>
<script>
  function App() {
    return {
      SEARCH_HISTORY_KEY: 'sonovel-search-history',
      SETTINGS_KEY: 'sonovel-settings',

      bookCache: [],
      currentPage: 1,
      dropdownItem: null,
      dropdownStyle: '',
      isSearching: false,
      latestFileName: '',
      localBooks: [],
      openDropdownIndex: null,
      searchHistory: [],
      searchKeyword: '',
      suggestions: [],
      showSuggestions: false,
      serverConfig: { searchLimit: -1, concurrency: -1, version: '', extName: 'epub', buildTime: '' },
      settings: { format: '', language: '', searchLimit: '', concurrency: '', showSuggestionsEnabled: true, shareSourceIds: [], mainSelectionInit: false, precisionSearch: false },
      shareSources: [],
      activeGroup: 'main',
      shareSourcesLoading: false,
      shareSourcesLoaded: 0,
      shareSourcesTotal: 0,
      shareSourcesSummary: '',
      shareSourcesFetched: false,
      shareSourceFilter: '',
      shareSourceLimit: 100,
      settingsVisible: false,
      showSearchHistory: false,
      showSources: false,
      sources: [],
      sourcesChecking: false,
      inputClass: 'w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10',
      iconBtnClass: 'text-xs text-gray-400 hover:text-primary p-1.5 rounded border border-gray-200 hover:border-primary transition-colors',
      sectionClass: 'bg-white rounded-xl shadow-md p-4 sm:p-6',
      h2Class: 'text-lg sm:text-2xl font-semibold text-primary border-l-4 border-primary pl-3',
      overlayClass: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm',
      cardClass: 'w-full rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-gray-900/5 max-h-[80vh] flex flex-col',
      iconDownload: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 10 12 15 17 10" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      iconDelete: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      iconClock: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      iconSearch: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      iconRefresh: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      iconStop: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      showTip: false,
      tipText: '正在加载...',
      downloadCurrent: 0,
      downloadTotal: 0,
      downloading: false,
      localBooksLoading: false,
      notices: [],
      searchScanDone: 0,
      searchScanTotal: 0,
      searchFoundCount: 0,
      _noticeSeq: 0,
      _searchCancel: null,
      _searchCancelled: false,
      _evtSource: null,

      get concurrencyMax() {
        return this.serverConfig.concurrency > 0 ? this.serverConfig.concurrency : 50
      },
      get defaultExtLabel() {
        const ext = this.settings.format || this.serverConfig.extName || 'epub'
        return ext.toUpperCase()
      },
      get pageSize() {
        const v = Number.parseInt(this.settings.searchLimit)
        return v > 0 ? v : 20
      },
      get paginatedBooks() {
        const start = (this.currentPage - 1) * this.pageSize
        return this.bookCache.slice(start, start + this.pageSize)
      },
      get paginationInfo() {
        const maxVisible = 5
        let start = Math.max(1, this.currentPage - Math.floor(maxVisible / 2))
        let end = Math.min(this.totalPages, start + maxVisible - 1)
        if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1)
        const pages = []
        for (let i = start; i <= end; i++) pages.push(i)
        return { start, end, pages }
      },
      get searchLimitMax() {
        return this.serverConfig.searchLimit > 0 ? this.serverConfig.searchLimit : 100
      },
      get totalPages() {
        return Math.max(1, Math.ceil(this.bookCache.length / this.pageSize))
      },
      get versionLink() {
        return this.serverConfig.version ? `https://github.com/freeok/so-novel/releases/tag/v${this.serverConfig.version}` : '#'
      },

      init() {
        this.loadSettings()
        this.fetchConfig()
        // 静默刷新已下书籍：后台刷新不应弹全屏 loading 模态
        this.fetchLocalBooks(true)
        this.initSSE()
        this.loadSearchHistory()
      },

      changePage(page) {
        this.closeDownloadMenu()
        if (page === 'prev') this.currentPage--; else if (page === 'next') this.currentPage++; else this.currentPage = Number.parseInt(page)
        this.currentPage = Math.max(1, Math.min(this.currentPage, this.totalPages))
        const el = document.getElementById('downloadContainer')
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
      },

      clearSearchHistory() {
        if (!confirm('确定清空全部搜索历史？')) return
        this.searchHistory = []
        localStorage.removeItem(this.SEARCH_HISTORY_KEY)
      },

      async fetchSuggestions() {
        if (!this.settings.showSuggestionsEnabled) {
          this.suggestions = [];
          this.showSuggestions = false;
          return
        }
        const kw = this.searchKeyword.trim()
        if (!kw) {
          this.suggestions = [];
          this.showSuggestions = false;
          return
        }
        try {
          const data = await Api.getSuggestions(kw)
          if (data && data.code === 200) {
            this.suggestions = data.data || []
            this.showSuggestions = this.suggestions.length > 0
          }
        } catch (_) {
          this.suggestions = [];
          this.showSuggestions = false
        }
      },

      selectSuggestion(index) {
        this.searchKeyword = this.suggestions[index]
      },

      closeSuggestions() {
        setTimeout(() => {
          this.showSuggestions = false
        }, 200)
      },

      removeSearchHistory(timestamp) {
        if (!confirm('确定删除该条搜索历史？')) return
        this.searchHistory = this.searchHistory.filter(h => h.timestamp !== timestamp)
        this._persistSearchHistory()
      },

      closeDownloadMenu() {
        this.openDropdownIndex = null
        this.dropdownItem = null
        this.dropdownStyle = ''
      },

      displayTip(text = '正在加载...') {
        this.tipText = text
        this.showTip = true
      },

      /** 内联提示（替代 alert，不阻塞页面；type: info | success | error） */
      showNotice(text, type = 'info') {
        const id = ++this._noticeSeq
        this.notices.push({ id, text, type })
        if (this.notices.length > 3) this.notices.shift()
        setTimeout(() => this.dismissNotice(id), type === 'error' ? 4000 : 2600)
      },

      dismissNotice(id) {
        this.notices = this.notices.filter(n => n.id !== id)
      },

      async fetchConfig() {
        try {
          const data = await Api.getConfig()
          if (data && data.data) Object.assign(this.serverConfig, data.data)
        } catch (_) {
        }
      },

      async fetchSources() {
        try {
          const data = await Api.getSources()
          if (data && data.data) this.sources = data.data
        } catch (_) {
        }
      },

      async fetchShareSources() {
        try {
          const data = await Api.getShareSources()
          if (data && data.data) {
            this.shareSources = data.data
            this.shareSourcesFetched = true
            this.shareSourceFilter = ''
            this.shareSourceLimit = 100
            if (this.shareSources.length) this.activeGroup = this.shareSources[0].file
            // 首次加载：默认勾选全部 main 书源（仅一次），保证 main 默认参与搜索，之后随用户勾选生效
            if (!this.settings.mainSelectionInit) {
              const mainGroup = this.shareSources.find(g => g.file === 'main')
              if (mainGroup) {
                const cur = new Set(this.settings.shareSourceIds || [])
                for (const s of mainGroup.sources) cur.add(s.sourceId)
                this.settings.shareSourceIds = [...cur]
              }
              this.settings.mainSelectionInit = true
              this.handleSettingChange()
            }
          }
        } catch (_) {
        }
      },

      async reloadShareSources() {
        this.shareSourcesLoading = true
        this.shareSourcesLoaded = 0
        this.shareSourcesTotal = 0
        this.shareSourcesSummary = ''
        return new Promise((resolve) => {
          const es = Api.reloadShareSources()

          es.onerror = () => {
            // 手动关闭，避免断线后 SSE 自动重连导致重复读取
            es.close()
            this.shareSourcesSummary = this.shareSourcesSummary || '读取额外书源失败，请稍后重试'
            resolve()
          }

          es.onmessage = (e) => {
            let msg
            try {
              msg = JSON.parse(e.data)
            } catch (err) {
              console.error('[额外书源] 进度数据解析失败', err, e.data)
              return
            }

            if (msg.type === 'progress') {
              this.shareSourcesLoaded = msg.index
              this.shareSourcesTotal = msg.total
              // 读取一条，控制台打印一条详细进程
              console.log(`[额外书源] 读取进度 ${msg.index}/${msg.total} ${msg.fileName} -> ${msg.sourceName} ${msg.ok ? 'OK' : '跳过'} | ${msg.message}`)
            } else if (msg.type === 'done') {
              if (Array.isArray(msg.data)) {
                this.shareSources = msg.data
                this.shareSourcesFetched = true
                this.shareSourceFilter = ''
                this.shareSourceLimit = 100
                if (this.shareSources.length && !this.shareSources.some(g => g.file === this.activeGroup)) {
                  this.activeGroup = this.shareSources[0].file
                }
              }
              this.shareSourcesSummary = `读取完成：成功 ${msg.success ?? 0}，跳过 ${msg.skipped ?? 0}`
              console.log(`[额外书源] 读取完成：成功 ${msg.success}, 跳过 ${msg.skipped}`)
              es.close()
              resolve()
            } else if (msg.type === 'error') {
              this.shareSourcesSummary = '读取失败：' + (msg.message || '未知错误')
              es.close()
              resolve()
            }
          }
        }).finally(() => {
          this.shareSourcesLoading = false
        })
      },

      async checkSources() {
        this.sourcesChecking = true
        try {
          const data = await Api.checkSources()
          if (data && data.data) this.sources = data.data
        } catch (_) {
        }
        this.sourcesChecking = false
      },

      async aggregatedSearch() {
        const value = this.searchKeyword.trim()
        if (!value) {
          this.showNotice('请输入书名或作者', 'error')
          return
        }
        this.closeDownloadMenu()
        this.showSearchHistory = false
        this.isSearching = true
        this._searchCancelled = false
        this.bookCache = []
        this.currentPage = 1
        this.searchScanDone = 0
        this.searchScanTotal = 0
        this.searchFoundCount = 0
        try {
          // 显式收集当前勾选的 main 书源 id，保证“取消勾选 main”能被后端识别（为空表示不搜任何 main）
          // 未展开过设置（尚未初始化 main 选择）时不传 mainSourceIds，后端默认全部 main 参与搜索
          const mainSel = this.settings.mainSelectionInit
            ? (this.settings.shareSourceIds || [])
                .filter(id => String(id).startsWith('main#'))
                .map(id => Number(String(id).slice(5)))
            : undefined
          const s = await Api.search(value, this.settings.shareSourceIds || [], '', mainSel, this.settings.precisionSearch)
          // 用户在请求发出期间已点「停止」，直接丢弃本次结果
          if (this._searchCancelled) {
            try { s.cancel() } catch (_) {}
            return
          }
          this._searchCancel = s.cancel
          await s.stream({
            onPage: (page) => {
              if (!page || !page.length) return
              this.bookCache = this.bookCache.concat(page)
            },
            onProgress: (done, total, found) => {
              this.searchScanDone = done
              this.searchScanTotal = total
              this.searchFoundCount = found
            },
            onDone: () => {
              if (this._searchCancelled) return
              this.isSearching = false
              this.searchScanDone = this.searchScanTotal
              // 搜索期间用户可能已翻页，这里只做越界收敛，不强制回到第 1 页
              this.currentPage = Math.min(this.currentPage, this.totalPages)
              if (!this.bookCache.length) {
                this.showNotice('未搜索到结果', 'error')
              } else {
                this.saveSearchHistory(value, this.bookCache)
              }
            },
            onError: (err) => {
              if (this._searchCancelled) return
              this.isSearching = false
              this.searchScanDone = this.searchScanTotal
              this.showNotice('搜索失败：' + err.message, 'error')
            }
          })
        } catch (error) {
          if (!this._searchCancelled) {
            this.isSearching = false
            this.searchScanDone = this.searchScanTotal
            this.showNotice('搜索失败：' + error.message, 'error')
          }
        } finally {
          if (!this.isSearching) this._searchCancel = null
        }
      },

      /** 停止正在进行的聚合搜索 */
      cancelSearch() {
        this._searchCancelled = true
        const cancel = this._searchCancel
        this._searchCancel = null
        if (cancel) {
          try { cancel() } catch (_) {}
        }
        this.isSearching = false
        this.searchScanDone = this.searchScanTotal
        if (this.bookCache.length) this.saveSearchHistory(this.searchKeyword.trim(), this.bookCache)
        this.showNotice('已停止搜索')
      },

      async handleDownloadToServer(item, format) {
        this.closeDownloadMenu()
        if (this.downloading) {
          this.showNotice('已有下载任务正在进行，请稍候')
          return
        }
        if (!item) {
          this.showNotice('参数错误，请重新搜索', 'error')
          return
        }
        this.downloadCurrent = 0
        this.downloadTotal = 0
        this.downloading = true
        this.displayTip('正在解析章节目录...')
        const params = new URLSearchParams({ ...item })
        const finalFormat = format || this.settings.format || ''
        if (finalFormat) params.set('format', finalFormat)
        if (this.settings.language) params.set('language', this.settings.language)
        if (this.settings.concurrency) params.set('concurrency', this.settings.concurrency)
        try {
          const resp = await Api.downloadBook(params)
          if (!resp.ok) {
            const data = await resp.json()
            throw new Error(data.message || '未知错误')
          }
          // 静默刷新，避免覆盖下载进度弹窗
          await this.fetchLocalBooks(true)
          location.href = `/book-download?filename=${encodeURIComponent(this.latestFileName)}`
        } catch (error) {
          this.showNotice('下载书籍到服务器失败：' + error.message, 'error')
        } finally {
          this.downloading = false
          this.hideTip()
        }
      },

      async fetchLocalBooks(silent = false) {
        this.localBooksLoading = true
        try {
          const data = await Api.getLocalBooks()
          if (data && data.data) {
            data.data.sort((a, b) => b.timestamp - a.timestamp)
            if (data.data[0]) this.latestFileName = data.data[0].name
            this.localBooks = data.data
          }
        } catch (error) {
          if (!silent) this.showNotice('刷新已下书籍失败：' + error.message, 'error')
        } finally {
          this.localBooksLoading = false
        }
      },

      async handleDeleteBook(filename) {
        if (!confirm(`确定删除「${filename}」？`)) return
        try {
          const res = await Api.deleteBook(filename)
          if (res.code === 200) {
            this.localBooks = this.localBooks.filter(item => item.name !== filename)
          } else {
            this.showNotice('删除失败：' + (res.message || '未知错误'), 'error')
          }
        } catch (error) {
          this.showNotice('删除失败：' + error.message, 'error')
        }
      },

      formatDate(timestamp) {
        return new Date(timestamp).toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        })
      },

      formatHistoryTime(ts) {
        const diff = Date.now() - ts
        if (diff < 60000) return '刚刚'
        if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`
        const d = new Date(ts)
        return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
      },

      formatSize(bytes) {
        if (bytes === 0) return '0.00 B'
        const k = 1024
        const sizes = ['B', 'KB', 'MB', 'GB']
        const i = Math.floor(Math.log(bytes) / Math.log(k))
        return `${(bytes / Math.pow(k, i)).toFixed(2)} ${sizes[i]}`
      },

      getGlobalIndex(index) {
        return (this.currentPage - 1) * this.pageSize + index + 1
      },

      handleDownloadFileToLocal(name) {
        location.href = `/book-download?filename=${encodeURIComponent(name)}`
      },

      handleSettingChange() {
        localStorage.setItem(this.SETTINGS_KEY, JSON.stringify(this.settings))
        if (this.bookCache.length > 0) this.currentPage = 1
      },

      toggleSettings() {
        const willOpen = !this.settingsVisible
        this.settingsVisible = willOpen
        // 懒加载：首次展开设置时才拉取书源列表，避免拖慢首页加载（列表较大）
        if (willOpen && !this.shareSourcesFetched && !this.shareSourcesLoading) {
          this.fetchShareSources()
        }
      },

      switchGroup(file) {
        this.activeGroup = file
        this.resetShareSourceView()
      },

      resetShareSourceView() {
        this.shareSourceLimit = 100
      },

      loadMoreShareSources() {
        this.shareSourceLimit += 100
      },

      /** 当前分组（并命中过滤）需要渲染的书源：分批渲染，避免一次性插入上千 DOM 造成卡顿 */
      sourcesFor(group) {
        if (!(this.settingsVisible && this.activeGroup === group.file)) return []
        return this._filteredSources(group).slice(0, this.shareSourceLimit)
      },

      filteredCount(group) {
        return this._filteredSources(group).length
      },

      _filteredSources(group) {
        if (!group || !group.sources) return []
        const f = (this.shareSourceFilter || '').trim().toLowerCase()
        if (!f) return group.sources
        return group.sources.filter(s =>
          String(s.name || '').toLowerCase().includes(f) ||
          String(s.url || '').toLowerCase().includes(f))
      },

      _allShareSourceIds() {
        const ids = []
        for (const group of this.shareSources) {
          for (const s of group.sources) ids.push(s.sourceId)
        }
        return ids
      },

      selectAllShareSources() {
        this.settings.shareSourceIds = this._allShareSourceIds()
        this.handleSettingChange()
      },

      deselectAllShareSources() {
        this.settings.shareSourceIds = []
        this.handleSettingChange()
      },

      invertShareSources() {
        const all = new Set(this._allShareSourceIds())
        const current = new Set(this.settings.shareSourceIds || [])
        this.settings.shareSourceIds = [...all].filter(id => !current.has(id))
        this.handleSettingChange()
      },

      selectGroupShareSources(group) {
        const groupIds = group.sources.map(s => s.sourceId)
        const merged = new Set([...(this.settings.shareSourceIds || []), ...groupIds])
        this.settings.shareSourceIds = [...merged]
        this.handleSettingChange()
      },

      invertGroupShareSources(group) {
        const groupIds = new Set(group.sources.map(s => s.sourceId))
        const others = (this.settings.shareSourceIds || []).filter(id => !groupIds.has(id))
        const selectedInGroup = group.sources.filter(s => !this.settings.shareSourceIds?.includes(s.sourceId)).map(s => s.sourceId)
        this.settings.shareSourceIds = [...others, ...selectedInGroup]
        this.handleSettingChange()
      },

      hideTip() {
        this.showTip = false
        this.downloadCurrent = 0
        this.downloadTotal = 0
      },

      dismissTip() {
        this.showTip = false
      },

      sourceColor(group, name) {
        const colors = ['#f97316', '#8b5cf6', '#06b6d4', '#10b981', '#ef4444',
          '#f59e0b', '#3b82f6', '#ec4899', '#14b8a6', '#84cc16', '#6366f1', '#f43f5e']
        const s = String(group || '') + '|' + String(name || '')
        let h = 0
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0
        return colors[h % colors.length]
      },

      initSSE() {
        // 避免重复初始化时残留多条 SSE 连接，占满浏览器同源连接数导致页面卡住
        if (this._evtSource) {
          this._evtSource.close()
        }
        const evtSource = new EventSource('/download-progress')
        this._evtSource = evtSource
        // 不监听 onopen/onerror：SSE 断线浏览器会自动重连，属正常情况，避免长跑刷屏
        evtSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data)
            if (data.type === 'download-progress') {
              this.downloadCurrent = data.index
              this.downloadTotal = data.total
            }
          } catch (err) {
            console.error("❌ SSE 数据解析失败:", err, e.data)
          }
        }
      },

      loadSearchHistory() {
        try {
          this.searchHistory = JSON.parse(localStorage.getItem(this.SEARCH_HISTORY_KEY) || '[]')
        } catch (_) {
          this.searchHistory = []
        }
      },

      loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(this.SETTINGS_KEY) || '{}')
          this.settings.format = saved.format || ''
          this.settings.language = saved.language || ''
          this.settings.searchLimit = saved.searchLimit || ''
          this.settings.concurrency = saved.concurrency || ''
          this.settings.shareSourceIds = Array.isArray(saved.shareSourceIds) ? saved.shareSourceIds : []
          this.settings.showSuggestionsEnabled = saved.showSuggestionsEnabled !== false
          this.settings.mainSelectionInit = saved.mainSelectionInit === true
          this.settings.precisionSearch = saved.precisionSearch === true
        } catch (_) {
        }
      },

      saveSearchHistory(keyword, results) {
        // 只保留单条最多 200 项结果，避免 localStorage 超配额
        const slim = Array.isArray(results) ? results.slice(0, 200).map(r => ({ ...r })) : []
        const entry = { keyword, results: slim, timestamp: Date.now() }
        const next = [entry, ...this.searchHistory.filter(h => h.keyword !== keyword)]
        this.searchHistory = next.slice(0, 20)
        this._persistSearchHistory()
      },

      /** 持久化搜索历史：超配额时逐级降级（丢结果 → 清空），绝不向外抛异常影响搜索流程 */
      _persistSearchHistory() {
        try {
          localStorage.setItem(this.SEARCH_HISTORY_KEY, JSON.stringify(this.searchHistory))
        } catch (_) {
          this.searchHistory = this.searchHistory.map(h => ({
            keyword: h.keyword,
            results: [],
            timestamp: h.timestamp
          }))
          try {
            localStorage.setItem(this.SEARCH_HISTORY_KEY, JSON.stringify(this.searchHistory))
          } catch (_) {
            this.searchHistory = []
            try { localStorage.removeItem(this.SEARCH_HISTORY_KEY) } catch (_) {}
          }
        }
      },

      selectHistory(item) {
        this.searchKeyword = item.keyword || ''
        const results = Array.isArray(item.results) ? item.results : []
        if (results.length) {
          this.bookCache = results
          this.currentPage = 1
        } else {
          this.showNotice('该历史未保存结果，请重新搜索')
        }
        this.showSearchHistory = false
      },

      toggleDownloadMenu(index, item, event) {
        if (this.openDropdownIndex === index) {
          this.closeDownloadMenu()
          return
        }
        const rect = event.currentTarget.getBoundingClientRect()
        const menuWidth = 144
        const menuHeight = 200
        let top = rect.bottom + 6
        if (top + menuHeight > window.innerHeight - 8) top = rect.top - menuHeight - 6
        let left = rect.right - menuWidth
        left = Math.max(8, Math.min(left, window.innerWidth - menuWidth - 8))
        this.openDropdownIndex = index
        this.dropdownItem = item
        this.dropdownStyle = `top:${top}px;left:${left}px`
      },

      validateAndSaveSettings(field) {
        let val = Number.parseInt(this.settings[field])
        if (field === 'searchLimit') {
          if (val > this.searchLimitMax) this.settings.searchLimit = this.searchLimitMax
          if (val < 10 && this.settings.searchLimit !== '') this.settings.searchLimit = 10
        } else if (field === 'concurrency') {
          if (val > this.concurrencyMax) this.settings.concurrency = this.concurrencyMax
          if (val < 1 && this.settings.concurrency !== '') this.settings.concurrency = 1
        }
        this.handleSettingChange()
      }
    }
  }
</script>
